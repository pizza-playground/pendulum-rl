    "gymnasium>=1.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "stable-baselines3>=2.9.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
