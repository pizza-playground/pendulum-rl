[project]
name = "cartpole-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "doyeon789", email = "ldyeon789@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
cartpole-rl = "cartpole-rl:main"

